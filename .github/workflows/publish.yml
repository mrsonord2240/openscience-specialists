name: Publish Specialist

on:
  workflow_dispatch:
    inputs:
      specialist_id:
        description: Stable Specialist ID (version resolved from repository)
        required: false
        type: string
      specialist_ids:
        description: Comma- or whitespace-separated Specialist IDs for one batch
        required: false
        type: string

concurrency:
  group: openscience-specialists-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate authoring input
        run: |
          npm run format:check
          npm test
          npm run validate

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
    env:
      SPECIALIST_ID: ${{ inputs.specialist_id }}
      SPECIALIST_IDS: ${{ inputs.specialist_ids }}
      MARKETPLACE_AUTHOR_POLICY: ${{ vars.MARKETPLACE_AUTHOR_POLICY || 'omit' }}
      MARKETPLACE_MIN_OPEN_SCIENCE_VERSION: ${{ vars.MARKETPLACE_MIN_OPEN_SCIENCE_VERSION }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the current main commit
        shell: bash
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Publication must be dispatched from main"
            exit 1
          }
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || {
            echo "::error::Publication commit is not the current main commit"
            exit 1
          }

      - name: Require protected publication configuration
        shell: bash
        env:
          MARKETPLACE_SIGNING_KEY_ID: ${{ vars.MARKETPLACE_SIGNING_KEY_ID }}
          MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64: ${{ vars.MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64 }}
          MARKETPLACE_EXPECTED_KEY_FINGERPRINT: ${{ vars.MARKETPLACE_EXPECTED_KEY_FINGERPRINT }}
        run: |
          required=(
            MARKETPLACE_SIGNING_KEY_ID
            MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64
            MARKETPLACE_EXPECTED_KEY_FINGERPRINT
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing protected publication configuration: ${name}"
              missing=1
            fi
          done
          case "$MARKETPLACE_AUTHOR_POLICY" in
            omit) ;;
            include)
              if [[ -z "$MARKETPLACE_MIN_OPEN_SCIENCE_VERSION" ]] || \
                 ! OPEN_SCIENCE_VERSION="$MARKETPLACE_MIN_OPEN_SCIENCE_VERSION" \
                   node --input-type=module -e \
                   'import { SEMVER_PATTERN } from "./scripts/lib/common.mjs"; process.exit(SEMVER_PATTERN.test(process.env.OPEN_SCIENCE_VERSION) ? 0 : 1)'; then
                echo "::error::Author publication requires a valid minimum Open Science SemVer"
                missing=1
              fi
              ;;
            *)
              echo "::error::MARKETPLACE_AUTHOR_POLICY must be omit or include"
              missing=1
              ;;
          esac
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Resolve Specialist publication plan
        shell: bash
        run: |
          set -euo pipefail
          published_args=()
          if git ls-remote --exit-code origin refs/heads/published >/dev/null; then
            git fetch origin published:refs/remotes/origin/published
            published_args=(--published origin/published)
          elif [[ "$?" -ne 2 ]]; then
            echo "::error::Unable to determine whether the published branch exists"
            exit 1
          fi
          input_args=()
          if [[ -n "$SPECIALIST_ID" ]]; then
            input_args+=(--specialist-id "$SPECIALIST_ID")
          fi
          if [[ -n "$SPECIALIST_IDS" ]]; then
            input_args+=(--specialist-ids "$SPECIALIST_IDS")
          fi
          mkdir -p dist
          node scripts/resolve-publication-plan.mjs \
            "${input_args[@]}" "${published_args[@]}" \
            > dist/publication-plan.json
          while IFS=$'\t' read -r specialist_id version; do
            echo "Resolved ${specialist_id}@${version} from reviewed repository content" \
              >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | [.specialist_id, .version] | @tsv' dist/publication-plan.json)

      - name: Build deterministic releases in parallel
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          labels=()
          while IFS=$'\t' read -r specialist_id version; do
            output="dist/candidates/${specialist_id}"
            npm run build:release -- \
              --specialist-id "$specialist_id" \
              --version "$version" \
              --output "$output" &
            pids+=("$!")
            labels+=("${specialist_id}@${version}")
          done < <(jq -r '.[] | [.specialist_id, .version] | @tsv' dist/publication-plan.json)
          failed=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "::error::Build failed for ${labels[$index]}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Prepare candidate Marketplace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64: ${{ vars.MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64 }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/published; then
            git show origin/published:marketplace.json > dist/base-marketplace.json
            git show origin/published:marketplace.json.sig > dist/base-marketplace.json.sig
            git archive origin/published releases | tar -x -C dist
            node scripts/list-release-artifacts.mjs \
              --marketplace dist/base-marketplace.json \
              --root dist > dist/base-artifacts.json
            while IFS=$'\t' read -r tag asset artifact_path; do
              mkdir -p "dist/$(dirname "$artifact_path")"
              gh release download "$tag" \
                --pattern "$asset" \
                --dir "dist/$(dirname "$artifact_path")" \
                --skip-existing
            done < <(jq -r '.[] | [.tag, .asset_name, .path] | @tsv' dist/base-artifacts.json)
            npm run verify:marketplace -- \
              --marketplace dist/base-marketplace.json \
              --signature dist/base-marketplace.json.sig \
              --root dist
          else
            cp protocol/fixtures/valid/empty-marketplace.json dist/base-marketplace.json
          fi
          cp dist/base-marketplace.json dist/marketplace.json
          while IFS=$'\t' read -r specialist_id version; do
            candidate="dist/candidates/${specialist_id}"
            mkdir -p "dist/releases/${specialist_id}" \
              "dist/specialists/${specialist_id}/${version}"
            cp "${candidate}/releases/${specialist_id}/${version}.json" \
              "dist/releases/${specialist_id}/${version}.json"
            cp "${candidate}/specialists/${specialist_id}/${version}/${specialist_id}-${version}.zip" \
              "dist/specialists/${specialist_id}/${version}/${specialist_id}-${version}.zip"
            node scripts/update-marketplace.mjs \
              --base dist/marketplace.json \
              --entry "${candidate}/marketplace-entry.json" \
              --release "dist/releases/${specialist_id}/${version}.json" \
              --author-policy "$MARKETPLACE_AUTHOR_POLICY" \
              --output dist/next-marketplace.json
            mv dist/next-marketplace.json dist/marketplace.json
          done < <(jq -r '.[] | [.specialist_id, .version] | @tsv' dist/publication-plan.json)

      - name: Sign candidate Marketplace
        env:
          MARKETPLACE_SIGNING_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.MARKETPLACE_SIGNING_PRIVATE_KEY_PKCS8_BASE64 }}
          MARKETPLACE_SIGNING_KEY_ID: ${{ vars.MARKETPLACE_SIGNING_KEY_ID }}
          MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64: ${{ vars.MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64 }}
          MARKETPLACE_EXPECTED_KEY_FINGERPRINT: ${{ vars.MARKETPLACE_EXPECTED_KEY_FINGERPRINT }}
        run: |
          node scripts/sign-marketplace.mjs \
            --marketplace dist/marketplace.json \
            --output dist/marketplace.json.sig

      - name: Verify candidate Marketplace
        env:
          MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64: ${{ vars.MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64 }}
        run: |
          npm run verify:marketplace -- \
            --marketplace dist/marketplace.json \
            --signature dist/marketplace.json.sig \
            --root dist

      - name: Reconcile immutable GitHub state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r specialist_id version; do
            tag="${specialist_id}-v${version}"
            asset="${specialist_id}-${version}.zip"
            expected_asset="dist/specialists/${specialist_id}/${version}/${asset}"
            state="dist/publication-state/${specialist_id}"
            existing="${state}/existing-release"
            mkdir -p "$existing"
            echo false > "${state}/release-exists"
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              > "${existing}/release.json" \
              2> "${existing}/error.log"; then
              target="$(jq -r '.target_commitish' "${existing}/release.json")"
              draft="$(jq -r '.draft' "${existing}/release.json")"
              prerelease="$(jq -r '.prerelease' "${existing}/release.json")"
              if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]] || \
                 ! git merge-base --is-ancestor "$target" "$GITHUB_SHA"; then
                echo "::error::Existing GitHub Release target is not an ancestor of the current main commit"
                exit 1
              fi
              git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
              [[ "$(git rev-list -n 1 "$tag")" == "$target" ]] || {
                echo "::error::Existing GitHub Release tag does not match its immutable target"
                exit 1
              }
              [[ "$draft" == false && "$prerelease" == false ]] || {
                echo "::error::Existing GitHub Release must be public and non-prerelease"
                exit 1
              }
              gh release download "$tag" --pattern "$asset" --dir "$existing"
              cmp "$expected_asset" "${existing}/${asset}" || {
                echo "::error::Existing GitHub Release asset bytes do not match"
                exit 1
              }
              echo true > "${state}/release-exists"
            elif ! grep -q "HTTP 404" "${existing}/error.log"; then
              cat "${existing}/error.log" >&2
              exit 1
            fi

            if git show-ref --verify --quiet refs/remotes/origin/published && \
               git cat-file -e "origin/published:releases/${specialist_id}/${version}.json" 2>/dev/null; then
              git show "origin/published:releases/${specialist_id}/${version}.json" \
                > "${existing}/descriptor.json"
              cmp "dist/releases/${specialist_id}/${version}.json" \
                "${existing}/descriptor.json" || {
                echo "::error::Existing published release descriptor bytes do not match"
                exit 1
              }
            fi
          done < <(jq -r '.[] | [.specialist_id, .version] | @tsv' dist/publication-plan.json)

      - name: Create immutable GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r specialist_id version; do
            if [[ "$(<"dist/publication-state/${specialist_id}/release-exists")" == true ]]; then
              continue
            fi
            tag="${specialist_id}-v${version}"
            asset="dist/specialists/${specialist_id}/${version}/${specialist_id}-${version}.zip"
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "${specialist_id} ${version}" \
              --notes "Immutable OpenScience Specialist release ${specialist_id}@${version}."
          done < <(jq -r '.[] | [.specialist_id, .version] | @tsv' dist/publication-plan.json)

      - name: Update published branch with verified metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git show-ref --verify --quiet refs/remotes/origin/published; then
            git worktree add .worktree/published origin/published
          else
            git worktree add --detach .worktree/published
            git -C .worktree/published switch --orphan published
          fi
          cp dist/marketplace.json .worktree/published/marketplace.json
          cp dist/marketplace.json.sig .worktree/published/marketplace.json.sig
          while IFS=$'\t' read -r specialist_id version; do
            mkdir -p ".worktree/published/releases/${specialist_id}"
            cp "dist/releases/${specialist_id}/${version}.json" \
              ".worktree/published/releases/${specialist_id}/${version}.json"
          done < <(jq -r '.[] | [.specialist_id, .version] | @tsv' dist/publication-plan.json)
          git -C .worktree/published add marketplace.json marketplace.json.sig releases
          if git -C .worktree/published diff --cached --quiet; then
            echo "Published metadata already matches the candidate"
          else
            git -C .worktree/published commit -m "feat(publishing): publish Specialist batch"
            git -C .worktree/published push \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:published
          fi
          echo "PUBLISHED_COMMIT=$(git -C .worktree/published rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prove GitHub byte equality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PUBLISHED_COMMIT}/"
          mkdir -p dist/final/github
          download() {
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 120 \
              "$1" -o "$2"
          }
          download "${raw}marketplace.json" dist/final/github/marketplace.json
          download "${raw}marketplace.json.sig" dist/final/github/marketplace.json.sig
          cmp dist/marketplace.json dist/final/github/marketplace.json
          cmp dist/marketplace.json.sig dist/final/github/marketplace.json.sig
          while IFS=$'\t' read -r specialist_id version; do
            descriptor="releases/${specialist_id}/${version}.json"
            artifact="specialists/${specialist_id}/${version}/${specialist_id}-${version}.zip"
            github_dir="dist/final/github/${specialist_id}"
            mkdir -p "$github_dir"
            download "${raw}${descriptor}" "${github_dir}/release.json"
            gh release download "${specialist_id}-v${version}" \
              --pattern "${specialist_id}-${version}.zip" --dir "$github_dir"
            cmp "dist/${descriptor}" "${github_dir}/release.json"
            cmp "dist/${artifact}" "${github_dir}/${specialist_id}-${version}.zip"
          done < <(jq -r '.[] | [.specialist_id, .version] | @tsv' dist/publication-plan.json)

      - name: Write public publication summary
        shell: bash
        env:
          MARKETPLACE_SIGNING_KEY_ID: ${{ vars.MARKETPLACE_SIGNING_KEY_ID }}
          MARKETPLACE_EXPECTED_KEY_FINGERPRINT: ${{ vars.MARKETPLACE_EXPECTED_KEY_FINGERPRINT }}
        run: |
          revision="$(node -p "JSON.parse(require('fs').readFileSync('dist/marketplace.json')).revision")"
          {
            echo "## Published Specialists"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Marketplace revision: ${revision}"
            echo "- Author policy: ${MARKETPLACE_AUTHOR_POLICY}"
            if [[ "$MARKETPLACE_AUTHOR_POLICY" == include ]]; then
              echo "- Minimum Open Science version: ${MARKETPLACE_MIN_OPEN_SCIENCE_VERSION}"
            fi
            echo "- Signing key ID: ${MARKETPLACE_SIGNING_KEY_ID}"
            echo "- Public key fingerprint: ${MARKETPLACE_EXPECTED_KEY_FINGERPRINT}"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r specialist_id version; do
            artifact_sha="$(node -p "JSON.parse(require('fs').readFileSync('dist/releases/${specialist_id}/${version}.json')).artifact.sha256")"
            {
              echo "- ${specialist_id}@${version}"
              echo "  - Tag: ${specialist_id}-v${version}"
              echo "  - Artifact SHA-256: ${artifact_sha}"
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | [.specialist_id, .version] | @tsv' dist/publication-plan.json)
